spring.application.name=harborview4

#-------------------- Thymeleaf ----------------------
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html
# spring.thymeleaf.excluded-view-names:
# spring.thymeleaf.mode: HTML5
# spring.thymeleaf.template-resolver-order:
# spring.thymeleaf.view-names:

#-------------------- MyBatis ----------------------
mybatis.config-location=classpath:/mybatis/mybatis.conf.xml


#-------------------- SSL Bundle ----------------------
# server.ssl.enabled=false

#-------------------- Log Level ----------------------
#logging.level.org.springframework.modulith=DEBUG

#-------------------- Adapters ----------------------
adapter.stockmarket.from-date=2000-01-01

#-------------------- Redis ----------------------
redis.host=172.20.1.2
redis.port=6379
redis.db=0
redis.fetchOpeningPrice=true

#-------------------- Caffeine ----------------------
# Minutes
cache.options.expiry.minutes=5
# Seconds
cache.option.expiry.seconds=30

#-------------------- Nordnet ----------------------
nordnet.curdate=today

#-------------------- Spring ----------------------
spring.cache.type=NONE
server.port=8080
spring.profiles.active=dev
